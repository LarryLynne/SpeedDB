<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Швидкості Доставки</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="main-nav">
        <button class="nav-btn active" data-view="speed">Швидкість доставки</button>
        <button class="nav-btn" data-view="timeline">Таймлайн руху посилок</button>
    </nav>

    <header class="tabs-container">
        <div id="speedFilters" class="filter-group">
            <div class="tabs-group">
                <button class="tab active" data-target="Нац-Нац">Нац-Нац</button>
                <button class="tab" data-target="Нац-Парт">Нац-Парт</button>
                <button class="tab" data-target="Парт-Нац">Парт-Нац</button>
                <button class="tab" data-target="Парт-Парт">Парт-Парт</button>
            </div>
            
            <div class="date-dropdown">
                <button class="date-dropdown-btn" id="speedDateDropdownBtn">Оберіть дати</button>
                <div class="date-dropdown-content" id="speedDateFilterContainer"></div>
            </div>
        </div>
        
        <div id="timelineFilters" class="filter-group hidden">
            <div class="date-dropdown">
                <button class="date-dropdown-btn" id="timelineDateDropdownBtn">Оберіть дати</button>
                <div class="date-dropdown-content" id="timelineDateFilterContainer"></div>
            </div>
        </div>
    </header>

    <div id="status">Завантаження даних...</div>

    <main class="dashboard-layout">
        <div id="speedWrapper" class="chart-wrapper">
            <h3>Швидкість доставки (год:хв / ЕН)</h3>
            <canvas id="speedChart"></canvas>
        </div>

        <div id="timelineWrapper" class="chart-wrapper hidden">
            <h3>Таймлайн руху посилок (год:хв)</h3>
            
            <div class="timeline-layout">
                <aside class="filter-sidebar">
                    <div class="filter-block">
                        <h4>Мережа відпр.</h4>
                        <div id="btnGroupNetA" class="btn-group"></div>
                    </div>
                    <div class="filter-block">
                        <h4>Кат. відпр.</h4>
                        <div id="btnGroupCatA" class="btn-group"></div>
                    </div>
                </aside>

                <div class="timeline-chart-container">
                    <canvas id="timelineChart"></canvas>
                </div>

                <aside class="filter-sidebar">
                    <div class="filter-block">
                        <h4>Мережа отрим.</h4>
                        <div id="btnGroupNetB" class="btn-group"></div>
                    </div>
                    <div class="filter-block">
                        <h4>Кат. отрим.</h4>
                        <div id="btnGroupCatB" class="btn-group"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
